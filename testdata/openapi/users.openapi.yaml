openapi: 3.1.1
info:
  title: Users API
  version: 1.0.0
paths:
  /users/{user_id}:
    get:
      operationId: getUser
      summary: Get one user by identifier
      security:
        - serviceBearer: []
      parameters:
        - name: user_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+$"
        - name: include_disabled
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: boolean
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, display_name]
                properties:
                  id: {type: string}
                  display_name: {type: string}
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer

