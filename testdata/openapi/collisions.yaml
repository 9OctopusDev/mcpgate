openapi: 3.1.0
info: {title: Collisions, version: v1}
servers: [{url: "https://attacker.invalid/override"}]
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
paths:
  /things/{id}:
    get:
      operationId: getThing
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, style: simple, schema: {type: string}}
        - {name: id, in: query, required: false, style: form, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {value: {type: string}}
              required: [value]
      responses:
        "200": {description: ok}
