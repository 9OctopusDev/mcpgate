openapi: 3.1.0
info: {title: Serialization, version: v1}
paths:
  /search:
    get:
      operationId: search
      parameters:
        - {name: active, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: empty, in: query, schema: {type: string}}
        - {name: nil, in: query, schema: {type: [string, "null"]}}
        - {name: tags, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: ids, in: query, style: form, explode: false, schema: {type: array, items: {type: integer}}}
      responses:
        "200": {description: ok}
